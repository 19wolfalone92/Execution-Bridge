name: Foundation CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          problem-matcher: true
      - name: Use hosted runner Android SDK
        run: |
          set -eu
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon -PbridgeSideBySide=true :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - run: |
          set -eu
          mkdir -p evidence
          cp app/build/outputs/apk/debug/app-debug.apk evidence/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs evidence/app-debug.apk
          cd evidence
          sha256sum app-debug.apk > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: execution-bridge-debug
          path: evidence/
          if-no-files-found: error

name: Foundation CI
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use hosted runner Android SDK
        run: |
          set -eu
          test -d "$ANDROID_HOME"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -1)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:lintDebug :app:testDebugUnitTest :app:assembleDebug
      - run: |
          set -eu
          mkdir -p evidence
          cp app/build/outputs/apk/debug/app-debug.apk evidence/
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs evidence/app-debug.apk
          cd evidence
          sha256sum app-debug.apk > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: execution-bridge-debug
          path: evidence/
          if-no-files-found: error
